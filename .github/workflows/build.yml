name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Compilar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: Testes
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: cmake -S . -B build && cmake --build build --config Release --parallel
      - name: Testes
        run: ctest --test-dir build -C Release --output-on-failure

  windows-exe:
    # .exe unico (MinGW estatico), o mesmo gerado por scripts/empacotar.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip
      - name: Empacotar
        run: scripts/empacotar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BloonsBattles-windows
          path: |
            build-win/BloonsBattles.exe
            build-win/bloons_servidor.exe
